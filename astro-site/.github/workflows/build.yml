name: build

on:
  push:
    branches: [main]
  pull_request:
  # lets anyone fork the repo and run the same checks
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the CMS media is large; skipping LFS here because none of it uses LFS,
          # and a shallow clone keeps the check fast
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # check-pages.mjs drives a browser
      - run: npx playwright install --with-deps chromium

      # The build is the schema check. Astro validates every content entry against the
      # Zod schemas in src/content.config.ts and fails on the first bad one, which is
      # what catches a malformed frontmatter field in a contributed post.
      - name: Build
        run: npm run build

      # Catches broken internal links, which the build alone does not detect: a post
      # can render perfectly while pointing at a page that was never generated.
      - name: Check internal links
        run: npm run verify:links

      - name: Check relative imports resolve
        run: python3 scripts/check-imports.py

      - name: Check frontmatter parses
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check-frontmatter.py

      # `t()` returns the key itself on a miss, so a wrong key or wrong casing renders as
      # visible text instead of failing. This catches that statically, in every template.
      - name: Check i18n keys resolve
        run: npm run verify:i18n

      # Loads a sample of routes in a real browser, which is the only way to see a component
      # that throws, a script that fails, or a heading a conditional dropped. The sampled
      # set is every locale against every top-level route plus one post per locale.
      - name: Check pages render
        run: |
          python3 scripts/serve.py dist 4400 &
          npx wait-on http://127.0.0.1:4400/en/ --timeout=30000
          npm run verify:pages

  deploy-preview:
    # Every pull request gets a live URL, so a writer can see their post rendered
    # before it merges. Requires the CLOUDFLARE_* secrets; skipped when absent.
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy preview
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=ergoplatform-org --branch=pr-${{ github.event.number }}
